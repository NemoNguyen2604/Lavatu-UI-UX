<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/lavatu-design-system-2cb1269d-d854-4a49-9886-8bde12fa8360/styles.css">
  <script src="_ds/lavatu-design-system-2cb1269d-d854-4a49-9886-8bde12fa8360/_ds_bundle.js"></script>
  <style>body{margin:0;background:#e2e8f0}a{color:#0f6554}a:hover{color:#074638}</style>
</helmet>
<section data-screen-label="SCR-002 Lượt 1" style="padding:80px;display:flex;flex-direction:column;gap:64px;width:max-content;font-family:var(--font-sans)">
  <header style="display:flex;flex-direction:column;gap:8px;max-width:1200px">
    <span style="font:var(--type-overline);letter-spacing:var(--tracking-overline);color:var(--color-text-muted)">SCR-002 · CHI TIẾT SẢN PHẨM · LƯỢT 1 · DESKTOP 1440</span>
    <h1 style="margin:0;font:var(--type-h1);color:var(--color-text-heading)">Chi tiết sản phẩm</h1>
    <p style="margin:0;font:var(--type-body-md);color:var(--color-text-body);max-width:860px;text-wrap:pretty">Khung 2a là prototype tương tác (chưa đăng nhập). Các khung còn lại là trạng thái. Contact Block dùng lại kiểu A của SCR-001.</p>
  </header>
  <div id="2a" style="display:flex;flex-direction:column;gap:12px">
    <span style="display:flex;align-items:center;gap:8px;font:var(--type-label-lg);color:var(--color-text-heading)"><span style="padding:2px 8px;border-radius:999px;background:#003527;color:#fff;font:var(--type-label-sm)">2a</span>Prototype — chưa đăng nhập</span>
    <div style="width:1440px;height:900px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-raised)">
      <dc-import name="Chi tiet san pham Page" style="width:1440px;height:900px" hint-size="1440px,900px"></dc-import>
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:48px;max-width:3040px">
    <sc-for list="{{ frames }}" as="fr" hint-placeholder-count="4">
      <div id="{{ fr.id }}" style="display:flex;flex-direction:column;gap:12px">
        <span style="display:flex;align-items:center;gap:8px;font:var(--type-label-lg);color:var(--color-text-heading)"><span style="padding:2px 8px;border-radius:999px;background:#003527;color:#fff;font:var(--type-label-sm)">{{ fr.id }}</span>{{ fr.label }}</span>
        <div style="width:1440px;height:900px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-raised)">
          <dc-import name="Chi tiet san pham Page" page-state="{{ fr.ps }}" stock="{{ fr.stock }}" images="{{ fr.images }}" desc="{{ fr.desc }}" logged-in="{{ fr.li }}" init-qty="{{ fr.qty }}" init-contact="{{ fr.c }}" init-login="{{ fr.login }}" init-toast="{{ fr.toast }}" init-lightbox="{{ fr.lb }}" init-scroll="{{ fr.scroll }}" style="width:1440px;height:900px" hint-size="1440px,900px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
  <div id="2z" style="display:flex;flex-direction:column;gap:12px">
    <span style="display:flex;align-items:center;gap:8px;font:var(--type-label-lg);color:var(--color-text-heading)"><span style="padding:2px 8px;border-radius:999px;background:#003527;color:#fff;font:var(--type-label-sm)">2z</span>Toàn trang</span>
    <div style="width:1440px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-raised)">
      <dc-import name="Chi tiet san pham Page" style="width:1440px" hint-size="1440px,2600px"></dc-import>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const d = { ps: 'data', stock: 'in', images: true, desc: 'long', li: false, qty: '1000', c: '', login: '', toast: false, lb: false, scroll: 0 };
    const L = [
      ['2b', 'Đang tải (skeleton)', { ps: 'loading' }],
      ['2c', 'Lỗi tải trang', { ps: 'error' }],
      ['2d', 'Không tìm thấy tin', { ps: 'notfound' }],
      ['2e', 'Tin hết hàng', { stock: 'out' }],
      ['2f', 'Khối lượng hợp lệ — 2.500 kg', { qty: '2500', li: true }],
      ['2g', 'Dưới mức tối thiểu', { qty: '600', li: true }],
      ['2h', 'Vượt khối lượng sẵn có', { qty: '25000', li: true }],
      ['2i', 'Contact Block — đang tải', { li: true, c: 'loading', scroll: 160 }],
      ['2j', 'Contact Block — đã hiện + toast', { li: true, c: 'revealed', toast: true, scroll: 160 }],
      ['2k', 'Contact Block — lỗi', { li: true, c: 'error', scroll: 160 }],
      ['2l', 'Popup đăng nhập', { login: 'main' }],
      ['2m', 'Lightbox ảnh', { lb: true }],
      ['2n', 'Không có ảnh', { images: false }],
      ['2o', 'Mô tả dài — thu gọn 6 dòng', { scroll: 640 }],
      ['2p', 'Mô tả ngắn', { desc: 'short', scroll: 640 }],
    ];
    return { frames: L.map(([id, label, o]) => ({ id, label, ...d, ...o })) };
  }
}
</script>
</body>
</html>
