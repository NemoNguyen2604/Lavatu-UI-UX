<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/lavatu-design-system-2cb1269d-d854-4a49-9886-8bde12fa8360/styles.css">
  <script src="_ds/lavatu-design-system-2cb1269d-d854-4a49-9886-8bde12fa8360/_ds_bundle.js"></script>
  <style>html,body{margin:0;height:100%}a{color:#0f6554}a:hover{color:#074638}</style>
</helmet>
<div data-screen-label="SCR-001 Nguồn vật liệu" style="width:100%;min-width:1440px;height:100vh">
  <dc-import name="Nguon vat lieu Page" device="desktop" variant="A" logged-in="{{ loggedIn }}" page-state="{{ pageState }}" reveal-error="{{ revealError }}" init-cats="{{ initCats }}" init-q="{{ initQ }}" init-region="{{ initRegion }}" style="width:100%;height:100vh" hint-size="100%,100vh"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;loggedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Trạng thái&quot;},&quot;pageState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;data&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;data&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Trạng thái&quot;},&quot;revealError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Trạng thái&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, b = (v) => v === true || v === 'true';
    const u = new URLSearchParams(window.location.search);
    return { loggedIn: b(p.loggedIn), pageState: p.pageState || 'data', revealError: b(p.revealError), initCats: u.get('cat') || '', initQ: u.get('q') || '', initRegion: u.get('region') || '' };
  }
}
</script>
</body>
</html>
